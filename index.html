<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071524">
<title>STI Detective: Final Boss — Final Desktop</title>
<style>
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:50;background:#111;color:#fff;border:3px solid #fff;border-radius:11px;padding:9px 13px;font-size:13px;font-weight:900;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
@media(max-width:980px){.screen{min-height:680px}.content{padding:24px}.start-grid{grid-template-columns:1fr}.hero-card{display:none}.hud{grid-template-columns:1fr 110px 110px}.hud-card:nth-child(4){display:none}.boss-grid{grid-template-columns:270px 1fr}.options{grid-template-columns:1fr}}

/* Phone layout: one document, two intentionally different presentations. */
@media(max-width:720px){
  html{background:var(--bg)}
  body{
    display:block;min-height:100vh;min-height:100dvh;padding:0;overflow-x:hidden;
    background:var(--paper);
  }
  .app{width:100%;max-width:none;min-width:0}
  .screen{
    width:100%;min-width:0;min-height:100vh;min-height:100dvh;border:0;border-radius:0;
    box-shadow:none;overflow:hidden;
  }
  .topbar{
    position:relative;min-height:56px;padding:7px 10px;border-bottom-width:4px;
    grid-template-columns:minmax(0,1fr) auto;gap:8px;
    padding-top:max(7px,env(safe-area-inset-top));
    padding-left:max(10px,env(safe-area-inset-left));
    padding-right:max(10px,env(safe-area-inset-right));
  }
  .dots{display:none}
  .top-title{
    min-width:0;text-align:left;font-size:12px;line-height:1.2;letter-spacing:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .top-actions{gap:6px}
  .icon-btn{
    width:40px;min-width:40px;height:40px;padding:0;border-width:3px;border-radius:8px;
    box-shadow:2px 2px 0 #111;
  }
  .content{
    padding:14px 12px calc(22px + env(safe-area-inset-bottom));
    padding-left:max(12px,env(safe-area-inset-left));
    padding-right:max(12px,env(safe-area-inset-right));
  }
  h1{font-size:40px;line-height:1.05;margin:8px 0}
  h2{font-size:27px;line-height:1.15;margin-bottom:12px}
  .pixel{letter-spacing:0;text-shadow:2px 2px 0 var(--yellow)}
  .subtitle{font-size:15px;line-height:1.55}
  .badge{max-width:100%;padding:5px 8px;border-width:3px;border-radius:8px;font-size:11px}
  .btn{
    min-height:48px;padding:9px 12px;border-width:3px;border-radius:10px;
    box-shadow:3px 3px 0 #111;font-size:14px;
  }
  .start-grid{display:block;min-height:0}
  .hero-card{display:none}
  .tags{gap:6px;margin:12px 0 15px}
  .tag{padding:5px 7px;border-width:2px;font-size:11px}
  .namebox{max-width:none;margin:15px 0}
  .namebox label{margin-bottom:6px;font-size:14px}
  .namebox input{height:48px;padding:9px 11px;border-width:3px;border-radius:9px;font-size:16px}
  .start-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .start-actions .btn{width:100%;min-width:0;padding-inline:7px}

  .hud{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:9px}
  .hud-card{min-width:0;padding:7px 4px;border-width:3px;border-radius:9px;font-size:11px}
  .hud-card.wide{grid-column:1/-1;text-align:left}
  .hud-card:nth-child(4){display:block}
  .progress{height:14px;margin-top:5px;border-width:2px}

  .card,.boss-panel,.board-wrap{min-width:0;border-width:3px;border-radius:12px;box-shadow:3px 3px 0 #111}
  .card{padding:12px}
  .qhead{gap:9px}
  .qicon{font-size:40px}
  .category{margin-top:5px;font-size:11px}
  .case-title{margin-top:7px;font-size:21px;line-height:1.25}
  .clues{grid-template-columns:1fr;gap:7px;margin:9px 0}
  .clue{min-height:0;padding:7px 9px;border-width:2px;border-radius:8px;font-size:12px}
  .prompt{margin:9px 0;font-size:16px;line-height:1.45}
  .options{grid-template-columns:1fr;gap:8px}
  .option{
    min-height:52px;padding:9px 10px;border-width:3px;border-radius:10px;
    box-shadow:2px 2px 0 #111;font-size:14px;line-height:1.4;
  }
  .actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
  .actions .btn{width:100%}
  .feedback{margin-top:8px;padding:8px 9px;border-width:2px;font-size:13px}
  .inventory{gap:6px}
  .token{padding:5px 7px;border-width:2px;font-size:11px}

  .transition{margin:14px auto}
  .transition h1{font-size:36px}
  .big-icon{font-size:82px;margin:10px 0}
  .warning{font-size:16px;line-height:1.35}

  .boss-grid{grid-template-columns:minmax(0,1fr);gap:12px}
  .boss-panel{
    display:grid;grid-template-columns:74px minmax(0,1fr);
    grid-template-rows:auto auto 18px auto 18px auto auto;gap:4px 10px;
    padding:10px 11px 11px;
  }
  .boss-panel>.warning{grid-column:1/-1;grid-row:1;text-align:center}
  .boss-panel>.boss-emoji{grid-column:1;grid-row:2/6;align-self:center}
  .boss-panel>.stat-label:nth-child(3){grid-column:2;grid-row:2}
  .boss-panel>.hpbar:nth-child(4){grid-column:2;grid-row:3}
  .boss-panel>.stat-label:nth-child(5){grid-column:2;grid-row:4}
  .boss-panel>.hpbar:nth-child(6){grid-column:2;grid-row:5}
  .boss-panel>.power-title{grid-column:1/-1;grid-row:6}
  .boss-panel>.powerups{grid-column:1/-1;grid-row:7}
  .boss-emoji{font-size:62px}
  .stat-label{min-width:0;margin:0;font-size:11px}
  .hpbar{height:18px;border-width:3px;border-radius:6px}
  .power-title{margin-top:5px;font-size:11px}
  .powerups{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:3px}
  .power{min-height:52px;padding:7px 8px;border-width:2px;border-radius:8px;font-size:11px;line-height:1.3}
  .timer{width:58px;height:58px;border-width:4px;font-size:22px;flex:0 0 58px}
  #bossQuestion{font-size:18px!important}
  .battle-log{min-height:44px;margin-top:10px;font-size:13px;line-height:1.45}
  .ko{font-size:17px}

  .end{margin:8px auto}
  .end-icon{font-size:76px}
  .end h1{font-size:34px}
  .score-big{font-size:44px}
  .summary{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:14px 0}
  .summary-card{min-width:0;padding:9px 4px;border-width:3px;border-radius:9px;font-size:12px}
  .end-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}

  .board-head{align-items:flex-start;gap:8px;margin-bottom:10px}
  .board-head h2{font-size:23px;margin-bottom:0}
  .board-wrap{padding:8px}
  .rank-scroll{width:100%;max-height:none;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .rank-table{min-width:660px}
  .rank-table th{font-size:11px;padding-inline:7px}
  .rank-table td{padding:8px 7px;font-size:12px}
  .board-actions{margin-top:10px}
  .board-actions .btn{width:100%}
  .empty{padding:30px 0}
  .toast{bottom:12px;max-width:calc(100% - 24px);text-align:center}

  .card,.clue,.prompt,.option,.feedback,.battle-log,.token,.power,.summary-card{
    overflow-wrap:anywhere;word-break:normal;
  }
  button,input{max-width:100%}
}

@media(max-width:390px){
  .content{padding-top:11px;padding-left:max(9px,env(safe-area-inset-left));padding-right:max(9px,env(safe-area-inset-right))}
  h1{font-size:34px}.transition h1{font-size:32px}h2{font-size:23px}
  .top-title{font-size:11px}
  .hud-card{font-size:10px}
  .summary-card{padding-inline:2px;font-size:11px}
}

@media(max-width:360px){
  .start-actions,.end-actions{grid-template-columns:1fr}
  .boss-panel{grid-template-columns:62px minmax(0,1fr);padding-inline:8px}
  .boss-emoji{font-size:52px}
  .powerups{grid-template-columns:1fr}
}

@media(hover:none) and (pointer:coarse){
  .option:hover:not(:disabled){background:#fff}
  .option.correct:hover{background:#bdf2d3}
  .option.wrong:hover{background:#ffd1d1}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
